<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>짱박이 다크 모드 시험</title>
<style>
/* Diagnostic page: which way of drawing a station-name halo survives a phone browser's own dark mode.
   Every tile is drawn in the light colours of the real map; the browser does the darkening. */
body { margin: 0; background: #E9EDF0; color: #15202A; font: 14px/1.4 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
.wrap { max-width: 400px; margin: 0 auto; padding: 12px 10px 40px; }
h1 { font-size: 18px; margin: 0 0 6px; }
.note { margin: 0 0 10px; font-size: 13px; }
.read { background: #FFFFFF; border: 1px solid #D3DAE0; border-radius: 10px; padding: 8px 10px; font-size: 12px; word-break: break-all; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, 180px); gap: 10px 12px; justify-content: center; }
figure { margin: 0; }
figcaption { font-size: 12px; font-weight: 700; margin-bottom: 3px; white-space: nowrap; overflow: hidden; }
figcaption b { display: inline-block; min-width: 20px; padding: 0 4px; margin-right: 4px; border-radius: 6px; background: #15202A; color: #FFFFFF; text-align: center; }
.tile { position: relative; width: 180px; height: 80px; background: #FBFCFD; border: 1px solid #D3DAE0; border-radius: 8px; overflow: hidden; }
.tile svg { display: block; width: 180px; height: 80px; }
.lb { font-weight: 500; font-size: 14px; fill: #15202A; }
.hbox { position: absolute; left: 90px; top: 44px; transform: translateX(-50%); font-weight: 500; font-size: 14px; line-height: 1; color: #15202A; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>짱박이 다크 모드 시험</h1>
  <p class="note">휴대폰 다크 모드를 켠 채 이 화면을 끝까지 캡처해 보내 주세요(두세 장). 칸마다 가운데 '연신내' 글자가 또렷한지 봅니다.</p>
  <div class="read" id="read">확인 중</div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function () {
  var MAP = '#FBFCFD', INK = '#15202A';
  // the bit of map under every label: line 3 across, line 6 slanting through the label, line 7 down through it, an interchange marker
  function net(extra) {
    return '<g' + (extra || '') + '>' +
      '<path d="M0 26H180" stroke="#EF7C1C" stroke-width="3.2" fill="none"/>' +
      '<path d="M30 80L150 0" stroke="#B5500B" stroke-width="3.2" fill="none"/>' +
      '<path d="M104 0V80" stroke="#747F00" stroke-width="3.2" fill="none"/>' +
      '<path d="M48 26h.01M150 26h.01" stroke="#EF7C1C" stroke-width="5" stroke-linecap="round" fill="none"/>' +
      '<path d="M48 26h.01M150 26h.01" stroke="' + MAP + '" stroke-width="2.4" stroke-linecap="round" fill="none"/>' +
      '<path d="M104 26h7" stroke="' + INK + '" stroke-width="9" stroke-linecap="round" fill="none"/>' +
      '<path d="M104 26h7" stroke="' + MAP + '" stroke-width="6.2" stroke-linecap="round" fill="none"/>' +
      '</g>';
  }
  var T = 'x="90" y="58" text-anchor="middle" class="lb"';
  var tiles = [
    ['지금 20판: 그라데이션 테두리', function (id) {
      return '<defs><linearGradient id="' + id + 'g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="' + MAP + '"/><stop offset="1" stop-color="' + MAP + '"/></linearGradient></defs>' +
        net() + '<text ' + T + ' style="paint-order:stroke fill;stroke:url(#' + id + 'g) ' + MAP + ';stroke-width:3.4px;stroke-linejoin:round">연신내</text>';
    }],
    ['19판: 단색 테두리', function () {
      return net() + '<text ' + T + ' style="paint-order:stroke fill;stroke:' + MAP + ';stroke-width:3.4px;stroke-linejoin:round">연신내</text>';
    }],
    ['테두리 색 조금 어둡게', function () {
      return net() + '<text ' + T + ' style="paint-order:stroke fill;stroke:#EEF1F4;stroke-width:3.4px;stroke-linejoin:round">연신내</text>';
    }],
    ['테두리 연회색', function () {
      return net() + '<text ' + T + ' style="paint-order:stroke fill;stroke:#D3DAE0;stroke-width:3.4px;stroke-linejoin:round">연신내</text>';
    }],
    ['글자 뒤 사각형(rect)', function () {
      return net() + '<rect x="65" y="45" width="50" height="17" rx="6" fill="' + MAP + '"/><text ' + T + '>연신내</text>';
    }],
    ['글자 뒤 타원(ellipse)', function () {
      return net() + '<ellipse cx="90" cy="53.5" rx="28" ry="9.5" fill="' + MAP + '"/><text ' + T + '>연신내</text>';
    }],
    ['HTML 글자 상자', function () {
      return net() + '</svg><span class="hbox" style="background:' + MAP + ';padding:2px 3px;border-radius:5px">연신내</span><svg style="display:none">';
    }],
    ['SVG 안 HTML 상자', function () {
      return net() + '<foreignObject x="60" y="42" width="60" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;justify-content:center"><span style="background:' + MAP + ';color:' + INK + ';font-weight:500;font-size:14px;line-height:1;padding:2px 3px;border-radius:5px">연신내</span></div></foreignObject>';
    }],
    ['HTML 글자 그림자', function () {
      var s = []; for (var a = 0; a < 16; a++) s.push((Math.cos(a * Math.PI / 8) * 1.7).toFixed(2) + 'px ' + (Math.sin(a * Math.PI / 8) * 1.7).toFixed(2) + 'px 0 ' + MAP);
      return net() + '</svg><span class="hbox" style="text-shadow:' + s.join(',') + '">연신내</span><svg style="display:none">';
    }],
    ['필터 테두리(정한 색)', function (id) {
      return '<defs><filter id="' + id + 'f" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">' +
        '<feMorphology in="SourceAlpha" operator="dilate" radius="1.7" result="fat"/><feFlood flood-color="' + MAP + '"/><feComposite in2="fat" operator="in"/>' +
        '<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
        net() + '<text ' + T + ' filter="url(#' + id + 'f)">연신내</text>';
    }],
    ['선을 글자 둘레만 비우기', function (id) {
      // alpha mask: colours inside it do not matter, only coverage; the cut shows the HTML background of the tile
      return '<defs><filter id="' + id + 'c" filterUnits="userSpaceOnUse" x="0" y="0" width="180" height="80">' +
        '<feFlood flood-color="#000" flood-opacity="1" result="all"/><feMorphology in="SourceAlpha" operator="dilate" radius="1.7" result="fat"/>' +
        '<feComposite in="all" in2="fat" operator="out"/></filter>' +
        '<mask id="' + id + 'm" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="80" mask-type="alpha" style="mask-type:alpha">' +
        '<g filter="url(#' + id + 'c)"><use href="#' + id + 't"/></g></mask></defs>' +
        net(' mask="url(#' + id + 'm)"') + '<text id="' + id + 't" ' + T + '>연신내</text>';
    }],
    ['테두리 없음', function () {
      return net() + '<text ' + T + '>연신내</text>';
    }],
    ['필터 테두리(글자색 반대)', function (id) {
      // halo colour worked out from the text colour as painted: dark text gets a light halo, light text a dark one
      return '<defs><filter id="' + id + 'a" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">' +
        '<feMorphology in="SourceGraphic" operator="dilate" radius="1.7" result="fat"/>' +
        '<feColorMatrix in="fat" type="matrix" values=".299 .587 .114 0 0 .299 .587 .114 0 0 .299 .587 .114 0 0 0 0 0 1 0"/>' +
        '<feComponentTransfer><feFuncR type="discrete" tableValues=".984 .114"/><feFuncG type="discrete" tableValues=".988 .118"/><feFuncB type="discrete" tableValues=".992 .122"/></feComponentTransfer>' +
        '<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
        net() + '<text ' + T + ' filter="url(#' + id + 'a)">연신내</text>';
    }],
    ['글자 뒤 path 사각형', function () {
      return net() + '<path d="M71 45h38a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6h-38a6 6 0 0 1-6-6v-5a6 6 0 0 1 6-6z" fill="' + MAP + '"/><text ' + T + '>연신내</text>';
    }],
    ['경로 막: 단색 rect', function () {
      return net() + '<rect x="0" y="0" width="180" height="80" fill="' + MAP + '" opacity=".52"/>' +
        '<path d="M0 62H180" stroke="#0052A4" stroke-width="5" fill="none"/><text x="90" y="50" text-anchor="middle" class="lb" style="paint-order:stroke fill;stroke:' + MAP + ';stroke-width:3.4px">연신내</text>';
    }],
    ['경로 막: 그라데이션', function (id) {
      return '<defs><linearGradient id="' + id + 'g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="' + MAP + '"/><stop offset="1" stop-color="' + MAP + '"/></linearGradient></defs>' +
        net() + '<rect x="0" y="0" width="180" height="80" fill="url(#' + id + 'g) ' + MAP + '" opacity=".52"/>' +
        '<path d="M0 62H180" stroke="#0052A4" stroke-width="5" fill="none"/><text x="90" y="50" text-anchor="middle" class="lb" style="paint-order:stroke fill;stroke:url(#' + id + 'g) ' + MAP + ';stroke-width:3.4px">연신내</text>';
    }],
    ['출발 표시: 지금(path)', function () {
      var d = 'M48 30h84a7 7 0 0 1 7 7v14a7 7 0 0 1-7 7h-36l-6 7-6-7h-36a7 7 0 0 1-7-7v-14a7 7 0 0 1 7-7z';
      return net() + '<path d="' + d + '" fill="none" stroke="' + MAP + '" stroke-width="5"/><path d="' + d + '" fill="#FFFFFF" stroke="' + INK + '" stroke-width="1.5"/>' +
        '<text x="52" y="48" font-size="11" fill="#5A6772">출발</text><text x="80" y="49" font-size="13.5" font-weight="700" fill="' + INK + '">연신내</text>';
    }],
    ['출발 표시: rect 바탕', function () {
      return net() + '<rect x="41" y="30" width="98" height="28" rx="7" fill="#FFFFFF" stroke="' + INK + '" stroke-width="1.5"/>' +
        '<text x="52" y="48" font-size="11" fill="#5A6772">출발</text><text x="80" y="49" font-size="13.5" font-weight="700" fill="' + INK + '">연신내</text>';
    }]
  ];
  var grid = document.getElementById('grid'), html = '';
  tiles.forEach(function (t, i) {
    var id = 't' + (i + 1);
    html += '<figure><figcaption><b>' + (i + 1) + '</b>' + t[0] + '</figcaption><div class="tile"><svg viewBox="0 0 180 80" xmlns="http://www.w3.org/2000/svg">' + t[1](id) + '</svg></div></figure>';
  });
  grid.innerHTML = html;

  // what the page can tell about the browser and its colour mode
  function mq(q) { try { return matchMedia(q).matches ? '예' : '아니오'; } catch (e) { return '모름'; } }
  var probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;width:0;height:0;color-scheme:light;background-color:Canvas';
  document.body.appendChild(probe);
  var canvasBg = getComputedStyle(probe).backgroundColor; probe.remove();
  var ua = navigator.userAgent, sb = /SamsungBrowser\/([\d.]+)/.exec(ua);
  document.getElementById('read').innerHTML =
    '삼성 인터넷: ' + (sb ? sb[1] : '아님') + '<br>' +
    '어두운 화면 선호(prefers-color-scheme: dark): ' + mq('(prefers-color-scheme: dark)') + '<br>' +
    '밝은 화면 선호(prefers-color-scheme: light): ' + mq('(prefers-color-scheme: light)') + '<br>' +
    '색 반전(inverted-colors): ' + mq('(inverted-colors: inverted)') + ', 고대비(forced-colors): ' + mq('(forced-colors: active)') + '<br>' +
    'Canvas 색: ' + canvasBg + '<br>' +
    '시각: ' + new Date().toLocaleString('ko-KR') + '<br>' + ua;
})();
</script>
</body>
</html>
